services:
  postgres:
    image: postgres:17-alpine
    container_name: manaseek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: manaseek
      POSTGRES_PASSWORD: manaseek
      POSTGRES_DB: manaseek
    ports:
      - '5434:5432'
    volumes:
      - manaseek-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U manaseek']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  manaseek-pgdata:
