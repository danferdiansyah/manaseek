services:
  postgres:
    image: postgres:17-alpine
    container_name: manaseek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: manaseek
      POSTGRES_PASSWORD: manaseek
      POSTGRES_DB: manaseek
    ports:
      - '5433:5432'
    volumes:
      - manaseek-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U manaseek']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: manaseek-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - manaseek-redisdata:/data

volumes:
  manaseek-pgdata:
  manaseek-redisdata:
