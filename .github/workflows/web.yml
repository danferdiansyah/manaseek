name: Web
on:
  push:
    branches: [main]
    paths: ['manaseek-ui/**', 'packages/shared/**', 'scripts/check-architecture.mjs', '.github/workflows/web.yml']
  pull_request:
    paths: ['manaseek-ui/**', 'packages/shared/**', 'scripts/check-architecture.mjs', '.github/workflows/web.yml']
permissions:
  contents: read
defaults:
  run:
    working-directory: manaseek-ui
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: manaseek-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: node ../scripts/check-architecture.mjs
