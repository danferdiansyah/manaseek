name: API

on:
  push:
    branches: [main]
    paths: ['manaseek-api/**', '.github/workflows/api.yml']
  pull_request:
    paths: ['manaseek-api/**', '.github/workflows/api.yml']

defaults:
  run:
    working-directory: manaseek-api

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: manaseek
          POSTGRES_PASSWORD: manaseek
          POSTGRES_DB: manaseek_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U manaseek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Both are required: the schema declares a directUrl for migrations.
      # In CI they point at the same server, since there is no pooler here.
      DATABASE_URL: postgresql://manaseek:manaseek@localhost:5432/manaseek_test?schema=public
      DIRECT_URL: postgresql://manaseek:manaseek@localhost:5432/manaseek_test?schema=public
      JWT_ACCESS_SECRET: ci-secret-ci-secret-ci-secret-ci-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: manaseek-api/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Verify migrations apply cleanly
        run: npx prisma migrate deploy

      - name: Verify the seed runs against a fresh database
        run: npm run db:seed
